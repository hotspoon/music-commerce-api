---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/artists":
    get:
      summary: List artists
      tags:
      - Artists
      responses:
        '200':
          description: artists found
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ArtistId:
                      type: integer
                    Name:
                      type: string
  "/api/v1/artists/{id}":
    get:
      summary: Get artist
      tags:
      - Artists
      parameters:
      - name: id
        in: path
        required: true
        description: Artist ID
        schema:
          type: integer
      responses:
        '200':
          description: artist found
          content:
            application/json:
              schema:
                type: object
                properties:
                  ArtistId:
                    type: integer
                  Name:
                    type: string
        '404':
          description: artist not found
servers:
- url: http://localhost:3000
  description: Development server
